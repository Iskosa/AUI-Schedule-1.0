name: Sync Schedule from Google Sheets

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and parse schedule
        run: python scripts/parse_schedule.py --download

      - name: Commit and push updated schedule.json if changed
        run: |
          if git diff --quiet public/data/schedule.json; then
            echo "No changes in public/data/schedule.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/schedule.json
          git commit -m "chore(schedule): auto-sync"
          git push
